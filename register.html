<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Croply | Farmer Registration</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="auth-page">


<div class="auth-container">


    <div class="auth-brand">

        🌱 Croply

        <span>
            Smart farming for India
        </span>

    </div>


    <div class="auth-card">

        <div class="auth-icon">
            👨‍🌾
        </div>

        <h1>
            Join Croply
        </h1>

        <p class="auth-subtitle">
            Create your farmer account
        </p>


        <form id="registerForm">


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="farmer@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <label>
                State
            </label>

            <input
                type="text"
                id="state"
                placeholder="e.g. Maharashtra"
                required
            >


            <label>
                District
            </label>

            <input
                type="text"
                id="district"
                placeholder="e.g. Pune"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Create Account →
            </button>


        </form>


        <p id="message"
           class="message">
        </p>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </div>

</div>


<script>

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const data = {

            name:
                document.getElementById("name").value,

            email:
                document.getElementById("email").value,

            password:
                document.getElementById("password").value,

            state:
                document.getElementById("state").value,

            district:
                document.getElementById("district").value

        };


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/register",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            const result =
                await response.json();


            if (response.ok) {

                message.textContent =
                    "✅ Account created! Redirecting...";

                message.className =
                    "message success";


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);

            }

            else {

                message.textContent =
                    "❌ " + result.message;

                message.className =
                    "message error";

            }


        }

        catch (error) {

            message.textContent =
                "❌ Cannot connect to Croply server.";

            message.className =
                "message error";

        }

    }

);

</script>


</body>

</html>
